<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # AllowOverride All : le public/.htaccess de symfony/apache-pack fait la
    # reecriture, exactement comme sur l'hebergement mutualise.
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
