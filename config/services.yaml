# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Au-dessus de ce score, une categorie proposee par une API est rattachee a une
    # categorie existante au lieu d'en creer une nouvelle (0 = tout fusionner, 1 = exact).
    app.category_similarity_threshold: 0.85
    app.google_books_api_key: '%env(GOOGLE_BOOKS_API_KEY)%'
    # Echeance proposee a la creation d'un pret et pas d'une prolongation.
    app.default_loan_days: 28
    # Duree pendant laquelle le nom de l'emprunteur reste attache a un pret rendu
    # (voir LoanAnonymizer). Annoncee sur /confidentialite : la changer ici change
    # aussi la promesse faite aux habitants.
    app.borrower_retention_months: 3

    # Coordonnees publiques de la bibliotheque, exposees aux gabarits sous le nom
    # `bibliotheque` (twig.yaml) : pied de page, accueil, « Infos pratiques »,
    # mentions legales. Un horaire qui change se corrige ici, et nulle part ailleurs.
    app.bibliotheque:
        adresse: ['35 rue des Pyrénées', '65190 Lespouey']
        horaires:
            - { jour: 'mardi', ouverture: '9 h', fermeture: '11 h 30' }
            - { jour: 'jeudi', ouverture: '16 h', fermeture: '18 h 30' }
        # Mentions legales (loi pour la confiance dans l'economie numerique, art. 6).
        # Une commune n'a pas a nommer son maire : la fonction suffit.
        courriel: 'lespouey.mairie@wanadoo.fr'
        editeur: 'Mairie de Lespouey'
        directeur_publication: 'Le maire de Lespouey'
        hebergeur:
            nom: 'OVH SAS'
            adresse: '2 rue Kellermann, 59100 Roubaix, France'
            telephone: '1007'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
