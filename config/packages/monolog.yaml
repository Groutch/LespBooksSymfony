monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# Sur le mutualise, php://stderr finit dans les journaux Apache de l'espace client
# OVH, illisibles en SSH : les erreurs s'ecrivent donc dans var/log, un fichier par
# jour (prod-AAAA-MM-JJ.log), lisible par `make prod-logs`. var/log survit a
# cache:clear. 14 jours de conservation : ces journaux peuvent porter l'e-mail
# d'un benevole ou l'adresse d'une page, rien a garder plus longtemps.
when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # Une erreur fait ecrire les 50 messages qui la precedent. Ceux de
                # doctrine portent le SQL avec ses valeurs, donc des noms
                # d'emprunteurs : l'exception elle-meme reste journalisee (canal request).
                channels: ["!deprecation", "!doctrine"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 14
                level: debug
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # A part : un avertissement de configuration se repete a chaque requete
            # et noierait les erreurs.
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.deprecations.log"
                max_files: 14
