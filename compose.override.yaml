
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Port fixe (et non aleatoire) : DATABASE_URL pointe sur 127.0.0.1:3306
      # sans avoir besoin de la CLI Symfony pour resoudre le port.
      - "3306:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
